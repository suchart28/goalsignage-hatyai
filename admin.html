<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signage Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

    <div id="login-modal">
        <h2 style="color:white; margin-bottom:20px; text-align: center;">🔒 ยืนยันตัวตน</h2>
        <div style="text-align: center;">
            <input type="password" id="password-input" placeholder="กรอกรหัสผ่าน" style="width: 80%; max-width:300px; text-align:center; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 1.2rem; margin-bottom: 15px;">
            <br>
            <button id="btn-login" class="btn-save" style="width: 80%; max-width:300px;">เข้าสู่ระบบ</button>
            <p id="login-error" style="color:#ff4d4d; display:none; margin-top:10px;">รหัสผ่านไม่ถูกต้อง</p>
        </div>
    </div>

    <div id="admin-root" class="control-panel" style="display:none;">
        <h1 style="text-align: center; margin: 10px 0 30px;">📱 ตั้งค่าร้านทอง</h1>
        
        <form id="control-form">
            <div class="card">
                <div class="card-title">🏠 ชื่อร้าน</div>
                <input type="text" id="shop-name-input" placeholder="เช่น ห้างทอง...">
            </div>

            <div class="card" style="border: 2px solid var(--gold-color);">
                <div class="card-title">
                    💰 ตั้งราคาทองเอง
                    <label style="float: right; font-size: 0.9rem; margin-top: 5px;">
                        <input type="checkbox" id="manual-mode-check"> เปิดใช้ปรับเอง
                    </label>
                </div>

                <div id="manual-inputs">
                    <label style="color:#33ff00;">ราคารับซื้อ (บาท)</label>
                    <input type="text" id="manual-buy-input" placeholder="เช่น 43000">
                    
                    <label style="color:#ffd700; margin-top:10px; display:block;">ราคาขายออก (บาท)</label>
                    <input type="text" id="manual-sell-input" placeholder="เช่น 43100">
                    
                    <small style="display:block; margin-top:10px; color:#aaa;">* ถ้าไม่ติ๊ก "เปิดใช้ปรับเอง" ระบบจะดึงราคาจากฮั่วเซ่งเฮงอัตโนมัติ</small>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📢 ข้อความตัววิ่ง</div>
                <input type="text" id="marquee-input" placeholder="พิมพ์ข้อความโปรโมชั่น...">
                <hr style="border:0; border-top:1px solid #444; margin: 20px 0;">
                <label>ความเร็วตัววิ่ง: <span id="speed-value-display" style="color:var(--gold-color);">40</span> วินาที</label>
                <input type="range" id="speed-input" min="5" max="120" step="1" value="40" style="width: 100%; margin-top: 10px;">
            </div>

            <button type="submit" class="btn-save">💾 บันทึกการตั้งค่า</button>
            <button type="button" id="btn-back-display" style="margin-top: 10px; background-color: #555; color: white; padding: 12px; border: none; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer;">📺 ไปหน้าจอแสดงผล</button>
            <button type="button" id="btn-logout" style="margin-top: 10px; background-color: #d9534f; color: white; padding: 12px; border: none; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer;">🚪 ออกจากระบบ</button>
        </form>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
