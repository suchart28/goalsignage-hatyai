<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signage Control Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div id="admin-root" class="control-panel">
        <h2>🎛️ แผงควบคุมจอ</h2>
        <form id="control-form">
            <label>เลือกโหมดการแสดงผล</label>
            <select id="mode-select">
                <option value="video">วิดีโอ (YouTube)</option>
                <option value="web">ราคาทองคำ (Web)</option>
            </select>

            <label>ลิงก์ YouTube (สำหรับโหมดวิดีโอ)</label>
            <input type="text" id="video-input" placeholder="วางลิงก์ Youtube ที่นี่...">

            <label>ข้อความตัววิ่ง</label>
            <input type="text" id="marquee-input" placeholder="พิมพ์ข้อความประกาศ...">

            <button type="submit">🚀 อัปเดตขึ้นจอทันที</button>
        </form>
        <p style="font-size: 0.8rem; color: #888; text-align: center; margin-top: 20px;">
            ระบบทำงานผ่าน Firebase Realtime Database
        </p>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
