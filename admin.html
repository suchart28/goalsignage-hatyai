<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signage Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* =========================================
           BULLETPROOF MOBILE FIRST & DESKTOP RESET
           ========================================= */
        
        /* บังคับให้ทุก Element คำนวณความกว้างรวม Padding เสมอ ป้องกันกล่องล้น */
        *, *::before, *::after {
            box-sizing: border-box !important;
        }

        /* รีเซ็ตหน้าเว็บ ป้องกันสกอร์บาร์แนวนอน และให้สกอร์บาร์แนวตั้งขึ้นเฉพาะเมื่อจำเป็น */
        html, body.admin-body {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background-color: #121212 !important;
            overflow-x: hidden !important; 
            overflow-y: auto !important; /* สกอร์บาร์แนวตั้งจะขึ้นเฉพาะเวลาเนื้อหายาวเกินจอ */
            min-height: 100vh;
        }

        :root {
            --gold-color: #ffd700;
            --accent-color: #ff3333;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --buy-color: #33ff00;
        }

        body.admin-body {
            color: var(--text-color);
            font-family: 'Prompt', sans-serif, system-ui;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Typography & Elements --- */
        h1, h2 {
            text-align: center;
            margin-top: 0;
            word-wrap: break-word;
        }

        input[type="text"], 
        input[type="password"] {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
            padding: 12px 15px;
            font-size: 16px; 
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: white;
            margin-top: 8px;
            transition: border-color 0.3s;
            display: block;
        }

        input[type="text"]:focus, 
        input[type="password"]:focus {
            outline: none;
            border-color: var(--gold-color);
        }

        button {
            width: 100% !important;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-save {
            background-color: var(--gold-color);
            color: #000;
            margin-top: 10px;
        }

        /* --- Layout: Login Modal --- */
        body.admin-body #login-modal {
            position: fixed !important;
            top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
            background: rgba(0, 0, 0, 0.9) !important;
            backdrop-filter: blur(5px);
            display: flex; /* ห้ามใส่ !important ตรงนี้ เพื่อให้ script.js สั่งซ่อนตอนล็อกอินผ่านได้ */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999 !important;
            box-sizing: border-box;
        }

        .login-box {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #login-error {
            color: var(--accent-color);
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        /* --- Layout: Admin Panel (แก้ปัญหาชิดซ้ายที่นี่) --- */
        body.admin-body #admin-root.control-panel {
            display: block !important;
            float: none !important;
            position: relative !important;
            left: auto !important;
            right: auto !important;
            margin: 0 auto !important; /* บังคับจัดกึ่งกลางหน้าจอคอมพิวเตอร์ */
            padding: 30px 16px 60px 16px !important;
            width: 100% !important;
            max-width: 550px !important; /* ขนาดกล่องควบคุมที่กระชับพอดีสายตา */
            box-sizing: border-box !important;
        }

        body.admin-body .card {
            background-color: var(--card-bg) !important;
            padding: 20px !important;
            border-radius: 12px !important;
            margin-bottom: 20px !important;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1) !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--gold-color);
        }

        body.admin-body .card-gold {
            border: 2px solid var(--gold-color) !important;
        }

        /* --- Manual Mode UI --- */
        .manual-toggle-box {
            background: #2a2a2a;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .manual-toggle-box label {
            margin: 0; 
            font-size: 1rem;
            font-weight: 500;
        }

        #manual-mode-check {
            width: 24px;
            height: 24px;
            accent-color: var(--accent-color);
            flex-shrink: 0;
        }

        .price-label-buy { color: var(--buy-color); display: block; margin-top: 10px; }
        .price-label-sell { color: var(--gold-color); display: block; margin-top: 15px; }
        
        .helper-text {
            display: block;
            margin-top: 12px;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* --- Range Slider --- */
        input[type="range"] {
            width: 100%;
            margin-top: 15px;
            accent-color: var(--gold-color);
        }

        hr.divider {
            border: 0;
            border-top: 1px solid #333;
            margin: 25px 0 15px;
        }

        /* =========================================
           DESKTOP ENHANCEMENTS (ปรับปรุงเมื่อเปิดจอคอม)
           ========================================= */
        @media (min-width: 768px) {
            .price-inputs-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }
            .price-label-sell { margin-top: 10px; }
        }
    </style>
</head>
<body class="admin-body">

    <div id="login-modal">
        <div class="login-box">
            <h2 style="color: white; margin-bottom: 25px;">🔒 ยืนยันตัวตน</h2>
            <input type="password" id="password-input" placeholder="กรอกรหัสผ่าน">
            <button id="btn-login" class="btn-save btn-login" style="margin-top: 20px;">เข้าสู่ระบบ</button>
            <p id="login-error">รหัสผ่านไม่ถูกต้อง</p>
        </div>
    </div>

    <div id="admin-root" class="control-panel">
        <h1 style="margin: 10px 0 30px;">📱 ตั้งค่าร้านทอง</h1>
        
        <form id="control-form">
            <div class="card">
                <div class="card-title">🏠 ชื่อร้าน</div>
                <input type="text" id="shop-name-input" placeholder="เช่น ห้างทอง...">
            </div>

            <div class="card card-gold">
                <div class="card-title">💰 ราคาทองคำแท่ง</div>
                
                <div class="manual-toggle-box">
                    <label>โหมดกำหนดราคาเอง (Manual)</label>
                    <input type="checkbox" id="manual-mode-check">
                </div>

                <div id="manual-inputs">
                    <div class="price-inputs-grid">
                        <div>
                            <label class="price-label-buy">ราคารับซื้อ (บาท)</label>
                            <input type="text" id="manual-buy-input" placeholder="เช่น 43,000">
                        </div>
                        <div>
                            <label class="price-label-sell">ราคาขายออก (บาท)</label>
                            <input type="text" id="manual-sell-input" placeholder="เช่น 43,100">
                        </div>
                    </div>
                    <small class="helper-text">* ถ้าไม่ติ๊ก "Manual" ระบบจะดึงราคาจากสมาคมฯ ให้อัตโนมัติ</small>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📺 YouTube Video / Shorts</div>
                <input type="text" id="video-input" placeholder="วางลิงก์ที่นี่...">
            </div>

            <div class="card">
                <div class="card-title">📢 ข้อความตัววิ่ง</div>
                <input type="text" id="marquee-input" placeholder="พิมพ์ข้อความ...">
                
                <hr class="divider">
                
                <label>ความเร็วตัววิ่ง: <span id="speed-display" style="color:var(--gold-color); font-weight:bold;">ปกติ</span></label>
                <input type="range" id="speed-input" min="1" max="100" value="50">
            </div>

            <button type="submit" class="btn-save">🚀 อัปเดตข้อมูล</button>
        </form>
    </div>
    
    <script type="module" src="script.js"></script>
</body>
</html>
