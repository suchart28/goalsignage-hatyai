<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signage Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

    <div id="login-modal">
        <h2 style="color:white; margin-bottom:20px;">🔒 ยืนยันตัวตน</h2>
        <input type="password" id="password-input" placeholder="กรอกรหัสผ่าน" style="width: 80%; max-width:300px; text-align:center;">
        <button id="btn-login" class="btn-save btn-login">เข้าสู่ระบบ</button>
        <p id="login-error" style="color:red; display:none; margin-top:10px;">รหัสผ่านไม่ถูกต้อง</p>
    </div>

    <div id="admin-root" class="control-panel">
        <h1 style="text-align: center; margin: 10px 0 30px;">📱 ตั้งค่าร้านทอง</h1>
        
        <form id="control-form">
            <div class="card">
                <div class="card-title">🏠 ชื่อร้าน</div>
                <input type="text" id="shop-name-input" placeholder="เช่น ห้างทอง...">
            </div>

            <div class="card" style="border: 2px solid var(--gold-color);">
                <div class="card-title">💰 ราคาทองคำแท่ง</div>
                
                <div style="background:#333; padding:15px; border-radius:10px; margin-bottom:15px; display:flex; align-items:center; justify-content:space-between;">
                    <label style="margin:0; color:white; font-size:1.1rem;">โหมดกำหนดราคาเอง (Manual)</label>
                    <input type="checkbox" id="manual-mode-check" style="width:25px; height:25px; accent-color:var(--accent-color);">
                </div>

                <div id="manual-inputs">
                    <label style="color:#33ff00;">ราคารับซื้อ (บาท)</label>
                    <input type="text" id="manual-buy-input" placeholder="เช่น 43,000">
                    
                    <label style="color:#ffd700; margin-top:10px; display:block;">ราคาขายออก (บาท)</label>
                    <input type="text" id="manual-sell-input" placeholder="เช่น 43,100">
                    
                    <small style="display:block; margin-top:10px; color:#aaa;">* ถ้าไม่ติ๊ก "Manual" ระบบจะดึงราคาจากสมาคมฯ ให้อัตโนมัติ</small>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📺 YouTube Video / Shorts</div>
                <input type="text" id="video-input" placeholder="วางลิงก์ที่นี่...">
            </div>

            <div class="card">
                <div class="card-title">📢 ข้อความตัววิ่ง</div>
                <input type="text" id="marquee-input" placeholder="พิมพ์ข้อความ...">
                <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">
                <label>ความเร็วตัววิ่ง: <span id="speed-display" style="color:var(--gold-color);">ปกติ</span></label>
                <input type="range" id="speed-input" min="1" max="100" value="50">
            </div>

            <button type="submit" class="btn-save">🚀 อัปเดตข้อมูล</button>
        </form>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
