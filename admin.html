<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div id="admin-root" class="control-panel">
        <h2>🎛️ ตั้งค่าหน้าจอ</h2>
        <form id="control-form">
            
            <label><b>🖼️ ลิงก์รูปโลโก้ (URL)</b></label>
            <input type="text" id="logo-input" placeholder="วางลิงก์รูปภาพ (.png / .jpg)">
            <small style="color:gray">เว้นว่างไว้ถ้าจะใช้รูปเดิม</small>

            <hr style="margin: 15px 0; border-top: 1px solid #ddd;">
            
            <label><b>📺 ลิงก์ YouTube</b></label>
            <input type="text" id="video-input" placeholder="วางลิงก์ Youtube ที่นี่...">

            <label><b>📢 ข้อความตัววิ่ง</b></label>
            <input type="text" id="marquee-input" placeholder="พิมพ์ข้อความประกาศ...">

            <button type="submit">บันทึกและแสดงผลทันที</button>
        </form>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
