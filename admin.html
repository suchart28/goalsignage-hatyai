<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการราคาทอง - ห้างทองเอราวัณ</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #a10000; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        input[type="number"], input[type="password"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; box-sizing: border-box; }
        .btn { background: #a10000; color: #fff; padding: 12px 20px; border: none; border-radius: 5px; width: 100%; font-size: 1.2rem; cursor: pointer; font-family: 'Prompt'; transition: background 0.3s;}
        .btn:hover { background: #800000; }
        .status { margin-top: 15px; text-align: center; font-weight: 600; color: green; }
        
        /* ซ่อนหน้าจัดการหลักไว้ก่อน จนกว่าจะเข้าสู่ระบบสำเร็จ */
        #admin-content { display: none; }
        #login-form { display: block; max-width: 400px; margin: 100px auto; text-align: center; }
        .login-title { color: #333; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="login-form" class="container">
        <h2 class="login-title">กรุณาใส่รหัสผ่านเพื่อเข้าใช้งาน</h2>
        <div class="form-group">
            <input type="password" id="password-input" placeholder="กรอกรหัสผ่าน 9 หลัก" autofocus>
        </div>
        <button class="btn" id="login-btn">เข้าสู่ระบบ</button>
    </div>

    <div id="admin-content" class="container">
        <h1>ระบบควบคุมราคาทอง</h1>
        
        <div class="form-group">
            <label>เลือกโหมดการแสดงผล</label>
            <select id="mode-select">
                <option value="auto">ดึงข้อมูลอัตโนมัติ (สมาคมค้าทองคำ)</option>
                <option value="manual">กำหนดราคาเอง (Manual)</option>
            </select>
        </div>

        <div id="manual-inputs" style="display: none;">
            <div class="form-group">
                <label>ราคารับซื้อ (บาท)</label>
                <input type="number" id="buy-input" step="any" placeholder="เช่น 44000">
            </div>
            <div class="form-group">
                <label>ราคาขายออก (บาท)</label>
                <input type="number" id="sell-input" step="any" placeholder="เช่น 44100">
            </div>
        </div>

        <button class="btn" id="save-btn">บันทึกการตั้งค่า</button>
        <button class="btn" id="logout-btn" style="background: #555; margin-top: 10px; font-size: 1rem; padding: 8px;">ออกจากระบบ</button>
        <div id="save-status" class="status"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCypw3-0kmRKQCtMuVakq4dL-IfQ3UIAG4",
            authDomain: "goldshop-d5860.firebaseapp.com",
            databaseURL: "https://goldshop-d5860-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "goldshop-d5860",
            storageBucket: "goldshop-d5860.firebasestorage.app",
            messagingSenderId: "15818908224",
            appId: "1:15818908224:web:5f0ec26cbcd0a20e0075a5",
            measurementId: "G-QT7YZPHHXG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const settingsRef = ref(db, 'gold_settings');

        // ส่วนของการตรวจสอบรหัสผ่าน
        const loginForm = document.getElementById('login-form');
        const adminContent = document.getElementById('admin-content');
        const passwordInput = document.getElementById('password-input');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');

        // ตรวจสอบสถานะว่าเคยล็อกอินค้างไว้ในเซสชันนี้ไหม
        if (sessionStorage.getItem('isGoldAdminLoggedIn') === 'true') {
            showAdminPage();
        }

        function checkPassword() {
            const securePass = "987654321"; // รหัสผ่านที่คุณกำหนด
            if (passwordInput.value === securePass) {
                sessionStorage.setItem('isGoldAdminLoggedIn', 'true');
                showAdminPage();
            } else {
                alert("รหัสผ่านไม่ถูกต้อง! กรุณาลองใหม่อีกครั้ง");
                passwordInput.value = "";
                passwordInput.focus();
            }
        }

        function showAdminPage() {
            loginForm.style.display = 'none';
            adminContent.style.display = 'block';
            loadDatabaseSettings(); // โหลดข้อมูลราคาทองคำหลังล็อกอินผ่าน
        }

        loginBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('isGoldAdminLoggedIn');
            window.location.reload();
        });


        // ส่วนของการจัดการราคาและ Firebase (โค้ดเดิมที่ทำงานถูกต้อง)
        const modeSelect = document.getElementById('mode-select');
        const manualInputs = document.getElementById('manual-inputs');
        const buyInput = document.getElementById('buy-input');
        const sellInput = document.getElementById('sell-input');
        const saveBtn = document.getElementById('save-btn');
        const statusEl = document.getElementById('save-status');

        modeSelect.addEventListener('change', (e) => {
            manualInputs.style.display = e.target.value === 'manual' ? 'block' : 'none';
        });

        function loadDatabaseSettings() {
            get(settingsRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    modeSelect.value = data.mode || 'auto';
                    if (data.mode === 'manual') manualInputs.style.display = 'block';
                    buyInput.value = data.manualPrices?.buy || '';
                    sellInput.value = data.manualPrices?.sell || '';
                }
            }).catch((err) => {
                console.error("Error fetching initial database setup:", err);
            });
        }

        saveBtn.addEventListener('click', () => {
            const mode = modeSelect.value;
            const buy = parseFloat(buyInput.value);
            const sell = parseFloat(sellInput.value);

            if (mode === 'manual' && (isNaN(buy) || isNaN(sell))) {
                alert("กรุณากรอกราคารับซื้อและขายออกให้ครบถ้วนและถูกต้อง");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerText = 'กำลังบันทึก...';

            set(settingsRef, {
                mode: mode,
                manualPrices: { 
                    buy: mode === 'manual' ? buy : 0, 
                    sell: mode === 'manual' ? sell : 0 
                }
            }).then(() => {
                statusEl.innerText = "บันทึกข้อมูลสำเร็จ! หน้าจอทีวีจะอัปเดตทันที";
                setTimeout(() => statusEl.innerText = "", 3000);
            }).catch((error) => {
                alert("เกิดข้อผิดพลาด: " + error);
                console.error("Save failed:", error);
            }).finally(() => {
                saveBtn.disabled = false;
                saveBtn.innerText = 'บันทึกการตั้งค่า';
            });
        });
    </script>
</body>
</html>
