<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="display-root" class="display-container">
        
        <div class="top-section">
            <div class="zone-gold">
                <div class="gold-header">
                    <img id="logo-image" src="https://www.goldtraders.or.th/images/logo.png" alt="Logo" class="gold-logo">
                    <h2>ราคาทองคำวันนี้</h2>
                    <p>ทองคำแท่ง 96.5% (สมาคมค้าทองคำ)</p>
                    <p id="gold-update-time" style="font-size: 1rem; opacity: 0.8; margin-top: 5px;">เวลา --:-- น.</p>
                </div>
                
                <div class="gold-price-container">
                    <div class="price-box">
                        <span class="price-label">รับซื้อ</span>
                        <span id="gold-buy" class="price-number">-.--</span>
                    </div>
                    <div class="price-box">
                        <span class="price-label">ขายออก</span>
                        <span id="gold-sell" class="price-number">-.--</span>
                    </div>
                </div>
            </div>

            <div class="zone-video">
                <iframe id="video-frame" src="" allow="autoplay; encrypted-media"></iframe>
            </div>
        </div>

        <div class="marquee-container">
            <div id="marquee-text" class="marquee-content">
                กำลังโหลดข้อมูล...
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
