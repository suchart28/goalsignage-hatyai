<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="display-root" class="display-container">
        
        <div class="top-section">
            
            <div class="zone-gold">
                <div class="gold-header">
                    <img src="logo.png" class="shop-logo" alt="Logo" onerror="this.style.display='none'">
                    <h1 id="shop-name-text" class="shop-name">ชื่อร้านทอง</h1>
                </div>
                
                <div class="price-wrapper">
                    <div class="price-card card-buy">
                        <div class="card-label">ราคารับซื้อ (บาท)</div>
                        <div id="gold-buy" class="price-number">-,---</div>
                    </div>

                    <div class="price-card card-sell">
                        <div class="card-label">ราคาขายออก (บาท)</div>
                        <div id="gold-sell" class="price-number">-,---</div>
                    </div>
                </div>

                <div class="clock-section-mini">
                    <div id="clock-time" class="mini-time">--:--:--</div>
                    <div id="clock-date" class="mini-date">กำลังโหลดวันที่...</div>
                    <div id="mode-indicator" class="manual-badge" style="display: none;">⚠ Manual Mode</div>
                </div>
            </div>

            <div class="zone-video">
                <div class="video-container-16-9">
                    <iframe id="video-frame" src="" allow="autoplay; encrypted-media"></iframe>
                </div>
            </div>
        </div>

        <div class="marquee-container">
            <div id="marquee-text" class="marquee-content">
                กำลังโหลดข้อมูล...
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
