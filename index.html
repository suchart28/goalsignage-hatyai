<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCypw3-0kmRKQCtMuVakq4dL-IfQ3UIAG4",
        authDomain: "goldshop-d5860.firebaseapp.com",
        databaseURL: "https://goldshop-d5860-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "goldshop-d5860",
        storageBucket: "goldshop-d5860.firebasestorage.app",
        messagingSenderId: "15818908224",
        appId: "1:15818908224:web:5f0ec26cbcd0a20e0075a5",
        measurementId: "G-QT7YZPHHXG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const buyPriceEl = document.getElementById('buy-price');
    const sellPriceEl = document.getElementById('sell-price');
    const updateTimeEl = document.getElementById('update-time');
    const modeStatusEl = document.getElementById('mode-status');

    function formatNumber(num) {
        if(!num || isNaN(num)) return "รอข้อมูล";
        return Number(num).toLocaleString('th-TH');
    }

    // ฟังก์ชันดึงข้อมูลแบบมีลิงก์สำรองอัตโนมัติ
    async function fetchApiPrices() {
        // ลิงก์หลัก (chnwt.dev) และ ลิงก์สำรอง (CORS Proxy ผ่านสมาคมฯ)
        const apiUrls = [
            'https://api.chnwt.dev/thai-gold-api/latest',
            'https://api.allorigins.win/raw?url=https://api.chnwt.dev/thai-gold-api/latest' // วิ่งผ่าน Proxy แก้ปัญหา CORS
        ];

        let success = false;

        for (let url of apiUrls) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.status === 'success' && data.response && data.response.price) {
                    const goldBar = data.response.price.gold_bar;
                    buyPriceEl.innerText = formatNumber(goldBar.buy);
                    sellPriceEl.innerText = formatNumber(goldBar.sell);
                    updateTimeEl.innerText = `${data.response.date} ${data.response.update_time}`;
                    success = true;
                    break; // ดึงสำเร็จแล้ว ให้หยุดการทำงานลูปทันที
                }
            } catch (error) {
                console.warn(`ลิงก์ดึงราคามีปัญหา กำลังสลับไปใช้ลิงก์สำรอง...`, error);
            }
        }

        if (!success) {
            buyPriceEl.innerText = "เปิดโหมดแมนนวล";
            sellPriceEl.innerText = "เปิดโหมดแมนนวล";
            updateTimeEl.innerText = "ระบบ API หลักขัดข้องชั่วคราว";
        }
    }

    const settingsRef = ref(db, 'gold_settings');
    onValue(settingsRef, (snapshot) => {
        const data = snapshot.val();
        const mode = data ? data.mode : 'auto'; 
        const manualBuy = data && data.manualPrices ? data.manualPrices.buy : null;
        const manualSell = data && data.manualPrices ? data.manualPrices.sell : null;

        if (mode === 'auto') {
            modeStatusEl.innerText = "อัตโนมัติ (API)";
            fetchApiPrices();
            if(!window.apiInterval) {
                window.apiInterval = setInterval(fetchApiPrices, 300000); // อัปเดตทุก 5 นาที
            }
        } else {
            modeStatusEl.innerText = "ปรับตั้งเอง (Manual)";
            if(window.apiInterval) {
                clearInterval(window.apiInterval);
                window.apiInterval = null;
            }
            buyPriceEl.innerText = formatNumber(manualBuy);
            sellPriceEl.innerText = formatNumber(manualSell);
            const now = new Date();
            updateTimeEl.innerText = `${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'})}`;
        }
    }, (error) => {
        console.error("Firebase Connect Error:", error);
        buyPriceEl.innerText = "เชื่อมต่อฐานข้อมูลไม่ได้";
        sellPriceEl.innerText = "เชื่อมต่อฐานข้อมูลไม่ได้";
    });
</script>
