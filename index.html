<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Shop Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-layout">
        
        <div class="left-panel">
            
            <div class="header-group">
                <img src="logo.png" class="shop-logo" alt="Logo" onerror="this.style.display='none'">
                <h1 id="shop-name-text" class="shop-name">ห้างเพชรทองโกลด์ไซน์</h1>
                <div class="sub-header">ราคาทองคำแท่ง</div>
            </div>

            <div class="price-container">
                
                <div class="price-row">
                    <div class="price-label">รับซื้อ</div>
                    <div class="price-value-box">
                        <span id="gold-buy" class="the-price">-,---</span>
                    </div>
                </div>

                <div class="price-row">
                    <div class="price-label">ขายออก</div>
                    <div class="price-value-box">
                        <span id="gold-sell" class="the-price">-,---</span>
                    </div>
                </div>

            </div>

            <div class="spacer"></div>

            <div class="clock-footer">
                <div id="clock-time" class="time-text">--:--:--</div>
                <div id="clock-date" class="date-text">กำลังโหลดวันที่...</div>
                <div id="mode-indicator" class="manual-tag" style="display: none;">Manual Mode</div>
            </div>
        </div>

        <div class="right-panel">
            <iframe id="video-frame" src="" allow="autoplay; encrypted-media"></iframe>
        </div>

    </div>

    <div class="marquee-wrapper">
        <div id="marquee-text" class="marquee-content">
            ยินดีต้อนรับเข้าสู่ห้างทอง...
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
