<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="display-root" class="display-container">
        
        <div class="top-section">
            
            <div class="zone-gold">
                <div class="gold-header">
                    <img src="logo.png" class="shop-logo" alt="Logo" onerror="this.style.display='none'">
                    <h1 id="shop-name-text" class="shop-name">ชื่อร้านทอง</h1>
                </div>
                
                <div class="main-title">
                    ราคาทองคำแท่ง 96.5%
                    <span id="mode-indicator" style="font-size: 1rem; color: #aaa; display: none;">(Manual Mode)</span>
                </div>

                <div class="price-wrapper">
                    
                    <div class="price-card card-buy">
                        <div class="card-header">ราคารับซื้อ (บาท)</div>
                        <div class="card-body">
                            <span id="gold-buy" class="price-number">-,---</span>
                        </div>
                    </div>

                    <div class="price-card card-sell">
                        <div class="card-header">ราคาขายออก (บาท)</div>
                        <div class="card-body">
                            <span id="gold-sell" class="price-number">-,---</span>
                        </div>
                    </div>

                </div>
            </div>

            <div class="zone-video">
                <div class="clock-section">
                    <div id="clock-time" class="big-time">--:--:--</div>
                    <div id="clock-date" class="big-date">กำลังโหลดวันที่...</div>
                </div>
                <div class="video-wrapper">
                    <iframe id="video-frame" src="" allow="autoplay; encrypted-media"></iframe>
                </div>
            </div>
        </div>

        <div class="marquee-container">
            <div id="marquee-text" class="marquee-content">
                กำลังโหลดข้อมูล...
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
